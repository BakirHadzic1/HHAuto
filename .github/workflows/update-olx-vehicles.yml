name: Update OLX vehicles

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-vehicles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sync active OLX listings
        run: python scripts/sync_olx.py

      - name: Commit updated vehicle data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update OLX vehicle listings"
          file_pattern: fronted/data/vozila.json
